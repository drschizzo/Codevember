# Teste puis publie les expériences sur GitHub Pages à chaque push sur main.
# (Réglage du dépôt requis une fois : Settings → Pages → Source : « GitHub Actions ».)
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # invariants des projets (sans navigateur) et cohérence du dépôt : rien
  # n'est publié si un test échoue
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # site statique : la page d'index et chaque expérience — tout dossier de
      # premier niveau qui contient un index.html (une expérience par dossier),
      # sans les outils ni les textes Markdown (les images de docs/ et les pages
      # explainer.html des défis techniques sont publiées) ; plus l’accueil (home/,
      # vignettes et feuille de style commune des pages de documentation)
      - name: Assembler le site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r home _site/   # (vignettes de la page d'accueil)
          cp -r shared _site/ # (modules communs aux projets : sans eux, aucune scène ne se charge)
          rm -rf _site/shared/test
          for d in */; do
            d=${d%/}
            if [ "$d" != _site ] && [ -f "$d/index.html" ]; then
              echo "expérience : $d"
              rsync -a --exclude tools --exclude '*.md' "$d" _site/
            fi
          done
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
