<!doctype html><meta charset="utf-8"><body style="margin:0;background:#050506">
<canvas id="c" width="1280" height="800"></canvas>
<script type="module">
// Aperçu du dessin de chargement hors du worker : ?seed=…&p=…&t=…&f=famille
import createArt from '../src/app/loaderArt.js';
import { generate } from '../src/recipe.js';
import { planOf } from '../src/app/plan.js';
const q = new URLSearchParams(location.search);
const R = generate(q.get('seed') || 'a1', q.get('f') ? { family: q.get('f') } : {});
const art = createArt();
art.data({ plan: planOf(R) });
const c = document.getElementById('c'), ctx = c.getContext('2d');
ctx.fillStyle = '#050506'; ctx.fillRect(0, 0, c.width, c.height);
art.draw(ctx, { w: c.width, h: c.height, dpr: 1, t: +(q.get('t') || 2.3), dt: 0.016, p: +(q.get('p') || 0.6), done: 0 });
</script>
