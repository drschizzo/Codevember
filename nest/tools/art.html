<!doctype html><meta charset="utf-8"><title>Nest — dessin du chargement</title>
<style>html,body{margin:0;background:#0d0d0e}canvas{display:block}</style>
<canvas id="c" width="1280" height="800"></canvas>
<script type="module">
// Le dessin de l'écran de chargement, rendu sur la page (sans worker) à un
// avancement donné : ?p=0.55&mood=…&seed=… — pour les vignettes de l'accueil.
import createArt from '../src/app/loaderArt.js';
import { generate } from '../src/recipe.js';
const q = new URLSearchParams(location.search);
const R = generate(q.get('seed') || 'a1', q.get('mood') ? { mood: q.get('mood') } : {});
const art = createArt();
art.data({ seed: R.seed, palette: R.nest.palette, a: R.nest.spec.a, b: R.nest.spec.b, topK: R.nest.spec.topK ?? 1, yBeam: R.nest.spec.yBeam });
const c = document.getElementById('c'), ctx = c.getContext('2d');
const S = { w: c.width, h: c.height, dpr: 1, t: 3, dt: 0.016, p: +(q.get('p') ?? 0.55), done: 0 };
ctx.fillStyle = '#0d0d0e'; ctx.fillRect(0, 0, c.width, c.height);
const t0 = performance.now(); art.draw(ctx, S); window.__ms = performance.now() - t0;
window.__done = true;
</script>
